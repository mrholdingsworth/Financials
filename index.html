<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e13; --panel:#11161f; --panel2:#151b26; --line:#212a38; --line2:#2c3646;
  --tx:#e6ebf2; --sub:#9aa6b8; --mut:#697588;
  --blue:#4d9fff; --bluebg:rgba(77,159,255,.10);
  --gold:#b08d3f;
  --green:#2fd583; --greenbg:rgba(47,213,131,.10);
  --red:#f4655f;   --redbg:rgba(244,101,95,.10);
  --amber:#f0a832; --amberbg:rgba(240,168,50,.10);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* --- surfaces --- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:14px}
.head{font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.muted{color:var(--mut);font-size:12px}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.scroll{overflow-x:auto}
.pos{color:var(--green)} .neg{color:var(--red)}

/* --- controls --- */
label,.lbl{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
           letter-spacing:.08em;margin-bottom:4px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:64px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:8px;
  padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--blue);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:disabled:hover{border-color:var(--line2);color:var(--tx)}
button.primary{background:var(--blue);border-color:var(--blue);color:#04101f;font-weight:600}
button.primary:hover{background:#69b0ff;color:#04101f}
button.danger{color:var(--red);border-color:rgba(244,101,95,.35)}
button.danger:hover{background:var(--redbg);border-color:var(--red)}
button.warn{color:var(--amber);border-color:rgba(240,168,50,.55)}
button.warn:hover{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
button.small{padding:4px 10px;font-size:12px}
.err{color:var(--red);font-size:12px;margin-top:5px}
.okmsg{color:var(--green);font-size:12px;margin-top:5px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.fields>div{display:flex;flex-direction:column}
.fields>div>label{margin-top:auto}

/* --- pills, banners --- */
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 9px;
      border-radius:999px;text-transform:uppercase}
.pill.good{background:var(--greenbg);color:var(--green);border:1px solid rgba(47,213,131,.3)}
.pill.bad{background:var(--redbg);color:var(--red);border:1px solid rgba(244,101,95,.3)}
.pill.info{background:var(--bluebg);color:var(--blue);border:1px solid rgba(77,159,255,.3)}
.pill.warn{background:var(--amberbg);color:var(--amber);border:1px solid rgba(240,168,50,.3)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:13px}
.banner.red{background:var(--redbg);border:1px solid rgba(244,101,95,.4);color:var(--red)}
.banner.amber{background:var(--amberbg);border:1px solid rgba(240,168,50,.4);color:var(--amber)}

/* --- tables --- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;
   padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono)}

details{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
details summary{cursor:pointer;font-size:12.5px;color:var(--sub);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"\25B8  ";color:var(--mut)}
details[open] summary::before{content:"\25BE  "}

.vbar{color:var(--gold);font-weight:700;padding:0 6px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:660px){.split{grid-template-columns:1fr}.wrap{padding:16px 12px 60px}}

/* --- modal: tools open over the page, which blurs behind them --- */
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.55);
       -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
       align-items:flex-start;justify-content:center;padding:5vh 20px}
.modal.open{display:flex}
.modalcard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
           max-width:1000px;width:100%;max-height:90vh;display:flex;flex-direction:column;
           box-shadow:0 24px 70px rgba(0,0,0,.5)}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px 12px;border-bottom:1px solid var(--line)}
.mtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mtitle h3{font-size:16px}
.mbody{overflow:auto;padding:16px 22px 20px}
button.close{font-size:20px;line-height:1;padding:3px 10px;color:var(--sub)}
body.locked{overflow:hidden}
@media(max-width:660px){.modal{padding:10px}.modalcard{max-height:calc(100vh - 20px)}.mbar,.mbody{padding-left:14px;padding-right:14px}}

/* --- this app --- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{border:none;border-radius:0;background:transparent;display:inline-flex;align-items:center}
.seg button+button{border-left:1px solid var(--line2)}
.seg button:hover{color:#fff}
.seg button.on{background:var(--bluebg);color:var(--blue)}
.rctl .seg button{height:32px}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:7px;border-radius:999px;background:var(--amber);
       color:#1a1100;font-size:11px;font-weight:700;line-height:18px;text-align:center}
button.attn{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}
.banner.blue{background:var(--bluebg);border:1px solid rgba(77,159,255,.35);color:var(--blue);
             display:flex;justify-content:space-between;align-items:center;gap:10px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--tx);
     text-transform:none;letter-spacing:0;margin:0;cursor:pointer}
.chk input{width:auto;margin:0;accent-color:var(--blue);width:15px;height:15px}
.recbox{margin-top:14px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.recbox input,.recbox select{background:var(--panel)}
.recfields{margin-top:10px;grid-template-columns:120px 130px 210px 210px}
@media(max-width:760px){.recfields{grid-template-columns:1fr 1fr}}
.tbcard{grid-column:1/-1}
.tbcard .scroll{max-width:760px}
.tbcard .stmt tr.ac td:first-child{white-space:nowrap;width:1%}
.dt{color:var(--gold)}
th.dt{color:var(--gold)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap}
.word{font-size:26px;font-weight:700;letter-spacing:-.02em}
.coname{font-size:15px;color:var(--sub)}
.topstat{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button.on{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
button.on.primary{background:var(--blue);color:#04101f}
button.link{background:none;border:none;padding:0;color:var(--blue);font-size:12px}
button.link:hover{text-decoration:underline;color:var(--blue)}
.headrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.headrow .head{margin-bottom:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.entryhead{grid-template-columns:160px 150px minmax(0,1fr)}
@media(max-width:660px){.entryhead{grid-template-columns:1fr 1fr}.entryhead .wide{grid-column:1/-1}}
.acctform{grid-template-columns:110px minmax(0,1.4fr) 130px minmax(0,1.2fr) auto}
.acctform>div.go{justify-content:flex-end}
@media(max-width:860px){.acctform{grid-template-columns:repeat(auto-fit,minmax(136px,1fr))}}
table.lines td{border-bottom:none;padding:3px 4px}
table.lines input,table.lines select{padding:6px 8px}
input.num{text-align:right;font-family:var(--mono)}
td.act{text-align:right;white-space:nowrap}
tr.grp td{border-top:1px solid var(--line2)}
tr.secrow td{padding-top:14px;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line2)}
tr.inactive td{color:var(--mut)}
.dr{color:var(--tx)} .cr{padding-left:18px;color:var(--sub)}
.msg{min-height:20px}

.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.rhead h2{font-size:18px}
.rctl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rctl input{width:160px}
/* One height for every control in the row: a date input draws its calendar icon taller than a button's text. */
.rctl input,.rctl button{height:34px}
.rctl button{padding-top:0;padding-bottom:0}
.stmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px;align-items:start}
.stmts .card{margin-bottom:0}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shead h3{font-size:15px}
.period{font-size:11.5px;color:var(--mut);margin-bottom:8px}
.stmt td{border-bottom:none;padding:3px 6px}
.stmt th{padding:4px 6px}
.stmt td.num{white-space:nowrap;width:1%}
.stmt tr.sec td{padding-top:13px;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.stmt tr.grp td{border-top:none;padding-top:7px;color:var(--sub);font-weight:600;font-size:12px}
.stmt tr.ac td:first-child{padding-left:16px;color:var(--sub)}
.stmt tr.sub td{border-top:1px solid var(--line);font-weight:600}
.stmt tr.sub td:first-child{padding-left:10px}
.stmt tr.tot td{border-top:1px solid var(--line2);border-bottom:3px double var(--line2);font-weight:700;padding-top:6px;padding-bottom:6px}
.stmt tr.tot td.num{color:var(--gold)}
.stmt tr.tot td.num.pos{color:var(--green)} .stmt tr.tot td.num.neg{color:var(--red)}
.stmt tr.gap td{padding:5px}
.empty{padding:26px 20px;text-align:center}

@media print{
  :root{color-scheme:light;--bg:#fff;--panel:#fff;--panel2:#fff;--tx:#000;--sub:#222;--mut:#555;
        --line:#ccc;--line2:#888;--gold:#000;--green:#000;--red:#000}
  .no-print{display:none!important}
  .wrap{padding:0}
  .stmts{display:block}
  .stmts .card{break-inside:avoid;margin-bottom:18px;border:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="word">Books</span><span class="vbar">|</span><span class="coname" id="coName"></span></div>
    <div class="topstat no-print" id="topStat"></div>
  </header>
  <div id="banners" class="no-print"></div>

  <nav class="toolbar no-print" id="toolbar"></nav>

  <section class="card" id="rhead">
    <div class="rhead">
      <div>
        <h2 id="rtitle">Financial statements</h2>
        <div class="muted" id="rperiod"></div>
      </div>
      <div class="rctl no-print">
        <div><label>View</label><div class="seg" id="viewSeg"></div></div>
        <div><label for="asOf">As of</label><input type="date" id="asOf" onchange="setAsOf(this.value)"></div>
        <div class="row" id="yeBtns"></div>
        <button onclick="window.print()">Print</button>
      </div>
    </div>
  </section>
  <section class="stmts" id="stmts"></section>
</div>

<div class="modal no-print" id="toolModal" onmousedown="if(event.target===this)openTool(null)">
  <div class="modalcard" role="dialog" aria-modal="true" aria-labelledby="toolTitle">
    <div class="mbar"><div class="mtitle"><h3 id="toolTitle"></h3><span id="toolTag"></span></div>
      <button class="close" onclick="openTool(null)" title="Close (Esc)" aria-label="Close">×</button></div>
    <div class="mbody" id="tool"></div>
  </div>
</div>

<input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="importFile(this)">

<script>
"use strict";
const KEY = "books.v1";
const LEGACY_KEYS = [];
const SCHEMA = 1;

// The subtype is what places an account on the statements: its balance-sheet section and its
// cash-flow bucket both follow from it, so an account never has to be classified twice.
const TYPES = {
  asset:    {label:"Asset",     plural:"Assets",      subs:{cash:"Cash & equivalents", current:"Current asset", fixed:"Fixed asset", contra:"Accumulated depreciation", other:"Other asset"}},
  liability:{label:"Liability", plural:"Liabilities", subs:{current:"Current liability", longterm:"Long-term liability"}},
  equity:   {label:"Equity",    plural:"Equity",      subs:{contrib:"Owner capital / contributions", draws:"Owner draws / distributions", re:"Retained earnings"}},
  revenue:  {label:"Revenue",   plural:"Revenue",     subs:{operating:"Operating revenue", other:"Other income"}},
  expense:  {label:"Expense",   plural:"Expenses",    subs:{cogs:"Cost of goods sold", operating:"Operating expense", other:"Other expense"}}
};
const TYPE_ORDER = ["asset","liability","equity","revenue","expense"];

// Used only by the demo. New books start with an empty chart of accounts.
const DEMO_COA = [
  ["1000","Checking","asset","cash"],
  ["1010","Savings","asset","cash"],
  ["1100","Accounts Receivable","asset","current"],
  ["1200","Inventory","asset","current"],
  ["1300","Prepaid Expenses","asset","current"],
  ["1500","Equipment","asset","fixed"],
  ["1510","Vehicles","asset","fixed"],
  ["1590","Accumulated Depreciation","asset","contra"],
  ["1800","Security Deposits","asset","other"],
  ["2000","Accounts Payable","liability","current"],
  ["2100","Credit Card","liability","current"],
  ["2200","Accrued Liabilities","liability","current"],
  ["2300","Sales Tax Payable","liability","current"],
  ["2500","Loan Payable","liability","longterm"],
  ["3000","Owner's Capital","equity","contrib"],
  ["3100","Owner's Draws","equity","draws"],
  ["3900","Retained Earnings","equity","re"],
  ["4000","Sales","revenue","operating"],
  ["4100","Service Revenue","revenue","operating"],
  ["4900","Interest Income","revenue","other"],
  ["5000","Cost of Goods Sold","expense","cogs"],
  ["6000","Advertising","expense","operating"],
  ["6050","Bank Fees","expense","operating"],
  ["6100","Depreciation Expense","expense","operating"],
  ["6150","Insurance","expense","operating"],
  ["6200","Office Supplies","expense","operating"],
  ["6250","Professional Fees","expense","operating"],
  ["6300","Rent","expense","operating"],
  ["6350","Software & Subscriptions","expense","operating"],
  ["6400","Utilities","expense","operating"],
  ["6450","Wages","expense","operating"],
  ["7000","Interest Expense","expense","other"]
];

/* ---------- formatting ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Amounts are stored as integer cents so a year of postings cannot drift by a float penny.
const money = c => (c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt$ = c => (c<0?"-":"") + "$" + money(Math.abs(c));
// Statement convention: negatives in parentheses, zero as a dash.
const fmtA = c => c===0 ? "—" : (c<0 ? "(" + money(-c) + ")" : money(c));
const plain = c => c ? (c/100).toFixed(2) : "";
function toCents(s){
  s = String(s==null?"":s).replace(/[$,\s]/g,"");
  if(s==="") return 0;
  const m = s.match(/^(\d*)(?:\.(\d*))?$/);
  if(!m || (m[1]==="" && !m[2])) return NaN;
  if((m[2]||"").length > 2) return NaN;
  return parseInt(m[1]||"0",10)*100 + parseInt(((m[2]||"")+"00").slice(0,2),10);
}
function today(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const pad2 = n => String(n).padStart(2,"0");
// Day 0 of the next month is the last day of this one, so Feb comes out as 28 or 29 by the calendar, not by a table.
const lastDay = (y, m) => new Date(y, m, 0).getDate();
// Checks that the date actually exists, not just its shape: an imported 2025-02-29 is rejected.
function validDate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||"")) return false;
  const y = +s.slice(0,4), m = +s.slice(5,7), d = +s.slice(8,10);
  return m>=1 && m<=12 && d>=1 && d<=lastDay(y,m);
}
const fmtD = s => new Date(s+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
const gD = s => '<span class="dt">' + fmtD(s) + '</span>';
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- fiscal year ----------
   A fiscal year is named for the calendar year it ends in and always ends on the last day of the
   year-end month. Everything is done on YYYY-MM-DD strings, so no time zone or DST shift can move a
   boundary, and lastDay() handles leap years. */
const fyM = () => root.fyEnd;
const fyEndDate = fy => fy + "-" + pad2(fyM()) + "-" + pad2(lastDay(fy, fyM()));
const fyStart = fy => fyM()===12 ? fy + "-01-01" : (fy-1) + "-" + pad2(fyM()+1) + "-01";
const fyOf = date => { const y = +date.slice(0,4), m = +date.slice(5,7); return m>fyM() ? y+1 : y; };
const fyLabel = fy => "FY " + fy;

/* ---------- date stepping for recurring entries ----------
   Every occurrence is computed from the schedule's anchor, never from the previous occurrence, so a
   schedule anchored on Jan 31 lands on Feb 28 (or 29) and then back on Mar 31 rather than drifting to
   the 28th. Day math goes through Date.UTC, which has no DST days of 23 or 25 hours. */
function addMonths(s, n){
  const y = +s.slice(0,4), m0 = +s.slice(5,7) - 1 + n, d = +s.slice(8,10);
  const Y = y + Math.floor(m0/12), M = ((m0 % 12) + 12) % 12 + 1;
  return Y + "-" + pad2(M) + "-" + pad2(Math.min(d, lastDay(Y, M)));
}
function addDays(s, n){
  const t = new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10) + n));
  return t.getUTCFullYear() + "-" + pad2(t.getUTCMonth()+1) + "-" + pad2(t.getUTCDate());
}
const UNITS = {
  week:   {one:"Weekly",    label:"week(s)",    noun:"weeks",    step:(s,n) => addDays(s, 7*n)},
  month:  {one:"Monthly",   label:"month(s)",   noun:"months",   step:(s,n) => addMonths(s, n)},
  quarter:{one:"Quarterly", label:"quarter(s)", noun:"quarters", step:(s,n) => addMonths(s, 3*n)},
  year:   {one:"Yearly",    label:"year(s)",    noun:"years",    step:(s,n) => addMonths(s, 12*n)}
};

/* ---------- state ---------- */
let root, saveOk = true, loadNote = null, recNote = null;
const ui = {tool:null, asOf:today(), draft:null, acctForm:null, ledgerAcct:null, ledgerYear:"all",
            jYear:"all", jFilter:"", notice:null};

function blank(){
  return {schema:SCHEMA, company:"", fyEnd:12, view:"stmts", tbMode:"drcr", seq:1, changes:0, lastExport:null, accounts:[], entries:[], recurring:[]};
}
function demoAccounts(r){
  return DEMO_COA.map(([num,name,type,sub]) => ({id:r.seq++, num, name, type, sub, active:true}));
}

// Backfills every field added since v1, so old saves open without versioned migrations.
function normalize(r){
  if(!r || typeof r!=="object") return blank();
  if(!Array.isArray(r.accounts)) r.accounts = [];
  if(!Array.isArray(r.entries)) r.entries = [];
  r.schema = SCHEMA;
  r.company = String(r.company||"");
  r.fyEnd = Math.min(12, Math.max(1, Math.round(+r.fyEnd) || 12));
  r.view = r.view==="tb" ? "tb" : "stmts";
  r.tbMode = r.tbMode==="net" ? "net" : "drcr";
  r.changes = +r.changes || 0;
  if(r.lastExport===undefined) r.lastExport = null;
  let max = 0;
  r.accounts = r.accounts.filter(a => a && TYPES[a.type]).map(a => {
    const sub = TYPES[a.type].subs[a.sub] ? a.sub : Object.keys(TYPES[a.type].subs)[0];
    max = Math.max(max, +a.id||0);
    return {id:+a.id, num:String(a.num||""), name:String(a.name||""), type:a.type, sub, active:a.active!==false};
  });
  r.entries = r.entries.filter(e => e && validDate(e.date) && Array.isArray(e.lines)).map(e => {
    max = Math.max(max, +e.id||0);
    const out = {id:+e.id, date:e.date, ref:String(e.ref||""), memo:String(e.memo||""), lines:cleanLines(e.lines)};
    if(e.rec!=null) out.rec = +e.rec;
    return out;
  });
  if(!Array.isArray(r.recurring)) r.recurring = [];
  r.recurring = r.recurring.filter(t => t && validDate(t.anchor) && Array.isArray(t.lines) && UNITS[t.unit]).map(t => {
    max = Math.max(max, +t.id||0);
    return {id:+t.id, ref:String(t.ref||""), memo:String(t.memo||""), lines:cleanLines(t.lines),
            anchor:t.anchor, k:Math.max(0,+t.k||0), every:Math.max(1,Math.round(+t.every)||1), unit:t.unit,
            end:t.end==="date" ? "date" : "count", count:Math.max(1,Math.round(+t.count)||1), until:validDate(t.until) ? t.until : "",
            posted:Math.max(0,+t.posted||0), lastDate:validDate(t.lastDate) ? t.lastDate : "",
            status:["active","ended","done"].includes(t.status) ? t.status : "active"};
  });
  r.seq = Math.max(+r.seq||1, max+1);
  return r;
}
function cleanLines(ls){
  return ls.map(l => ({acct:+l.acct, dr:Math.max(0,Math.round(+l.dr||0)), cr:Math.max(0,Math.round(+l.cr||0))}));
}

function load(){
  try{
    let raw = localStorage.getItem(KEY);
    if(raw==null){
      for(const k of LEGACY_KEYS){
        const old = localStorage.getItem(k);
        if(old!=null){ raw = old; loadNote = "Carried your books over from an older version of this page. The old copy is left in place as a fallback."; break; }
      }
    }
    return raw==null ? blank() : normalize(JSON.parse(raw));
  }catch(e){
    saveOk = false;
    return blank();
  }
}

// Returns whether the write landed. A silent failure would leave the screen right and the disk empty.
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(root));
    saveOk = true;
  }catch(e){
    saveOk = false;
  }
  renderBanners();
  return saveOk;
}
function commit(){ root.changes++; return save(); }

/* ---------- accounts ---------- */
const acctById = id => root.accounts.find(a => a.id===id);
const sortedAccts = () => root.accounts.slice().sort((a,b) => a.num.localeCompare(b.num,undefined,{numeric:true}) || a.name.localeCompare(b.name));
const acctLabel = a => a ? a.num + " · " + a.name : "(missing account)";
const isIS = a => a.type==="revenue" || a.type==="expense";
// The sign that makes an account's balance read positive when it is doing its normal job.
function normalSign(a){
  if(a.type==="asset") return a.sub==="contra" ? -1 : 1;
  if(a.type==="expense") return 1;
  if(a.type==="equity" && a.sub==="draws") return 1;
  return -1;
}
function usage(){
  const m = new Map();
  for(const e of root.entries) for(const id of new Set(e.lines.map(l => l.acct))) m.set(id,(m.get(id)||0)+1);
  return m;
}
// Accounts a live schedule will post to. They can't be deleted either, or a future occurrence would point at nothing.
function recUsage(){
  const s = new Set();
  for(const t of root.recurring) if(t.status!=="done") for(const l of t.lines) s.add(l.acct);
  return s;
}

/* ---------- ledger math ---------- */
// Debit-minus-credit per account over [from, to]; from may be null for "since the beginning".
function sums(from, to){
  const m = new Map();
  for(const e of root.entries){
    if((from && e.date<from) || e.date>to) continue;
    for(const l of e.lines) m.set(l.acct, (m.get(l.acct)||0) + l.dr - l.cr);
  }
  return m;
}
function netIncome(m){
  let t = 0;
  for(const a of root.accounts) if(isIS(a)) t -= (m.get(a.id)||0);
  return t;
}
// The year closes itself: income before the start of D's fiscal year is retained earnings, income
// since is current-year net income. No closing entry is ever posted, so none can be forgotten or doubled.
function positionAt(D){
  const cum = sums(null, D), ytd = sums(fyStart(fyOf(D)), D);
  const ni = netIncome(ytd);
  return {cum, ni, prior: netIncome(cum) - ni};
}
function yearList(){
  const ys = new Set([fyOf(today())]);
  for(const e of root.entries) ys.add(fyOf(e.date));
  return [...ys].sort((a,b) => b-a);
}
function entryTotal(e){ return e.lines.reduce((t,l) => t+l.dr, 0); }
function unbalanced(){ return root.entries.filter(e => e.lines.reduce((t,l) => t+l.dr-l.cr, 0)!==0); }

/* ---------- journal entry ---------- */
const blankLine = () => ({acct:"", dr:"", cr:""});
const blankRec = () => ({on:false, every:"1", unit:"month", end:"count", count:"12", until:""});
function newDraft(date){ return {id:null, recId:null, date:date||today(), ref:"", memo:"", lines:[blankLine(), blankLine()], rec:blankRec()}; }

/* ---------- recurring: the form block ---------- */
function recBlock(d){
  const r = d.rec, tmpl = d.recId!=null;
  let h = '<div class="recbox">';
  if(!tmpl) h += '<label class="chk"><input type="checkbox"' + (r.on?' checked':'') + ' onchange="ui.draft.rec.on=this.checked;renderEntry()"> Make this recurring</label>';
  if(r.on || tmpl){
    const t = tmpl ? recById(d.recId) : null;
    h += '<div class="fields recfields">'
       + '<div><label>Repeats every</label><input type="number" min="1" max="99" value="' + esc(r.every) + '" oninput="ui.draft.rec.every=this.value;recPreview()"></div>'
       + '<div><label>Period</label><select onchange="ui.draft.rec.unit=this.value;recPreview()">'
       + Object.keys(UNITS).map(k => '<option value="' + k + '"' + (k===r.unit?' selected':'') + '>' + UNITS[k].label + '</option>').join("") + '</select></div>'
       + '<div><label>Stops</label><select onchange="ui.draft.rec.end=this.value;renderEntry()">'
       + '<option value="count"' + (r.end==="count"?' selected':'') + '>After a number of times</option>'
       + '<option value="date"' + (r.end==="date"?' selected':'') + '>On a date</option></select></div>'
       + (r.end==="count"
          ? '<div><label>Times in all' + (t ? ' (' + t.posted + ' posted)' : ', this one included') + '</label><input type="number" min="2" max="999" value="' + esc(r.count) + '" oninput="ui.draft.rec.count=this.value;recPreview()"></div>'
          : '<div><label>Last date</label><input type="date" value="' + esc(r.until) + '" oninput="ui.draft.rec.until=this.value;recPreview()"></div>')
       + '</div><div class="hint" id="recPrev"></div>';
  }
  return h + '</div>';
}
// Reads the schedule fields off the draft. Returns a spec or the reason it isn't one.
function parseRec(d){
  const r = d.rec, t = d.recId!=null ? recById(d.recId) : null, already = t ? t.posted : 0;
  const every = +r.every;
  if(!validDate(d.date)) return {err:"Give it a " + (t ? "next occurrence date." : "date.")};
  if(!Number.isInteger(every) || every<1 || every>99) return {err:"Repeats every takes a whole number from 1 to 99."};
  const s = {anchor:d.date, every, unit:r.unit, end:r.end, count:0, until:""};
  if(r.end==="count"){
    s.count = +r.count;
    if(!Number.isInteger(s.count) || s.count<1 || s.count>999) return {err:"Times in all takes a whole number up to 999."};
    if(!t && s.count<2) return {err:"A recurring entry needs at least two occurrences — for one, just post it."};
    if(t && s.count<=already) return {err:"Times in all has to be more than the " + already + " already posted. To end the schedule instead, use Stop in the Recurring list."};
  }else{
    if(!validDate(r.until)) return {err:"Give the schedule a last date."};
    s.until = r.until;
    const first = t ? d.date : UNITS[s.unit].step(d.date, every);   // a new schedule's first date is this entry itself
    if(s.until<first) return {err:t ? "The last date is before the next occurrence, so nothing would post." : "The last date comes before the second occurrence, so this would never repeat."};
  }
  s.remaining = r.end==="count" ? s.count - already : null;
  return s;
}
// The dates this spec will post, in order, starting with the anchor. Capped: a long weekly schedule does not need listing.
function specDates(s, max){
  const out = [];
  for(let k=0; out.length<max; k++){
    if(s.end==="count" && k>=s.remaining) break;
    const d = UNITS[s.unit].step(s.anchor, k*s.every);
    if(s.end==="date" && d>s.until) break;
    out.push(d);
  }
  return out;
}
function specCount(s){ return s.end==="count" ? s.remaining : specDates(s, 5000).length; }
function recPreview(){
  const el = $("recPrev"), d = ui.draft;
  if(!el || !d || !(d.rec.on || d.recId!=null)) return;
  const s = parseRec(d);
  if(s.err){ el.innerHTML = '<span style="color:var(--amber)">' + esc(s.err) + '</span>'; return; }
  const n = specCount(s), ds = specDates(s, 3), last = specDates(s, n).pop();
  const T = today(), due = specDates(s, n).filter(x => x<=T).length - (d.recId==null && d.date<=T ? 1 : 0);
  let h = (d.recId!=null ? n + ' more to post: ' : 'Posts ' + n + ' time' + (n===1?'':'s') + ': ')
        + ds.map(gD).join(", ") + (n>3 ? ' … ' + gD(last) : '') + '.';
  if(s.unit!=="week" && +s.anchor.slice(8,10)>28) h += ' In shorter months it lands on the last day of the month.';
  if(due>0) h += ' <b style="color:var(--amber)">' + due + ' of these ' + (due===1?'is':'are') + ' already due and will post as soon as you save.</b>';
  h += ' Later ones post on their date, the next time the books are open on or after it.';
  el.innerHTML = h;
}
function setAmt(i, col, v){ ui.draft.lines[i][col ? "cr" : "dr"] = v; entryTotals(); }
function draftTotals(){
  let dr = 0, cr = 0, bad = false;
  for(const l of ui.draft.lines){
    const a = toCents(l.dr), b = toCents(l.cr);
    if(isNaN(a) || isNaN(b)){ bad = true; continue; }
    dr += a; cr += b;
  }
  return {dr, cr, bad};
}
function entryTotals(){
  if(!$("tDr")) return;
  const t = draftTotals();
  $("tDr").textContent = money(t.dr);
  $("tCr").textContent = money(t.cr);
  let h;
  if(t.bad) h = '<span class="pill bad">Check amounts</span>';
  else if(t.dr===0 && t.cr===0) h = '';
  else if(t.dr===t.cr) h = '<span class="pill good">Balanced</span>';
  else h = '<span class="pill warn">' + (t.dr>t.cr ? 'Debits' : 'Credits') + ' over by ' + fmt$(Math.abs(t.dr-t.cr)) + '</span>';
  $("tDiff").innerHTML = h;
}
function addLine(){ ui.draft.lines.push(blankLine()); ui.notice = null; renderEntry(); }
function removeLine(i){ ui.draft.lines.splice(i,1); renderEntry(); }
function fillBalance(){
  const t = draftTotals();
  if(t.bad || t.dr===t.cr) return;
  let l = ui.draft.lines.find(x => !x.dr && !x.cr);
  if(!l){ l = blankLine(); ui.draft.lines.push(l); }
  if(t.dr>t.cr) l.cr = plain(t.dr-t.cr); else l.dr = plain(t.cr-t.dr);
  renderEntry();
}
function clearDraft(){ ui.draft = newDraft(ui.draft && ui.draft.date); ui.notice = null; renderEntry(); }
function cancelEdit(){ const back = ui.draft && ui.draft.recId!=null ? "recurring" : "journal"; ui.draft = null; ui.notice = null; ui.tool = back; renderTool(); }

// Shared by one-off entries and schedules: the same balance rules apply to both.
function validateLines(d){
  const errs = [], lines = [];
  if(!validDate(d.date)) errs.push("Give the entry a date.");
  d.lines.forEach((l,i) => {
    const dr = toCents(l.dr), cr = toCents(l.cr), n = i+1;
    if(isNaN(dr) || isNaN(cr)){ errs.push("Line " + n + ": the amount is not a number, or has more than two decimals."); return; }
    if(dr && cr){ errs.push("Line " + n + " has both a debit and a credit — split it into two lines."); return; }
    if(!dr && !cr) return;
    if(!l.acct){ errs.push("Line " + n + " has an amount but no account."); return; }
    lines.push({acct:+l.acct, dr, cr});
  });
  const tdr = lines.reduce((t,l) => t+l.dr, 0), tcr = lines.reduce((t,l) => t+l.cr, 0);
  if(!errs.length){
    if(lines.length<2) errs.push("An entry needs at least two lines with amounts.");
    else if(tdr!==tcr) errs.push((tdr>tcr?"Debits":"Credits") + " exceed " + (tdr>tcr?"credits":"debits") + " by " + fmt$(Math.abs(tdr-tcr)) + ". Entries must balance to post.");
  }
  return {errs, lines, tdr};
}
function showErrs(errs){ $("entryMsg").innerHTML = errs.map(e => '<div class="err">' + esc(e) + '</div>').join(""); }

function postEntry(){
  const d = ui.draft;
  if(d.recId!=null) return saveSchedule();
  const v = validateLines(d), errs = v.errs;
  const spec = d.rec.on && d.id==null ? parseRec(d) : null;
  if(spec && spec.err) errs.push(spec.err);
  if(errs.length) return showErrs(errs);

  let t = null, due = 0;
  if(spec){
    due = specDates(spec, specCount(spec)).filter(x => x<=today()).length - (d.date<=today() ? 1 : 0);
    // A warning, not a veto: backdating a schedule is legitimate, but a year of weekly entries arriving at once should not be a surprise.
    if(due>12 && !confirm(due + " occurrences of this schedule are already due and will be posted right away, on top of this entry. Post them all?")) return;
  }
  const rec = {id: d.id!=null ? d.id : root.seq++, date:d.date, ref:d.ref.trim(), memo:d.memo.trim(), lines:v.lines};
  const i = root.entries.findIndex(e => e.id===rec.id);
  if(i>=0){ const old = root.entries[i]; if(old.rec!=null) rec.rec = old.rec; root.entries[i] = rec; }
  else root.entries.push(rec);
  if(spec){
    t = {id:root.seq++, ref:rec.ref, memo:rec.memo, lines:v.lines.map(l => ({...l})), anchor:spec.anchor, k:1,
         every:spec.every, unit:spec.unit, end:spec.end, count:spec.count, until:spec.until,
         posted:1, lastDate:rec.date, status:"active"};
    rec.rec = t.id;
    root.recurring.push(t);
  }
  const caught = catchUp();
  const saved = commit();
  let text = (i>=0 ? "Saved changes to entry #" : "Posted entry #") + rec.id + " — " + fmt$(v.tdr) + " on " + fmtD(rec.date) + ".";
  if(t){
    text += " Scheduled " + freqText(t).toLowerCase() + ", " + (t.end==="count" ? t.count + " times in all" : "through " + fmtD(t.until)) + ".";
    if(caught.posted) text += " " + caught.posted + " more that were already due have been posted too.";
    text += t.status==="active" ? " Next: " + fmtD(nextDate(t)) + "." : " That completes the schedule.";
  }
  if(rec.date>ui.asOf) text += " It is dated after the statements' as-of date (" + fmtD(ui.asOf) + "), so it will not show below until you move that date.";
  else if(fyOf(rec.date)!==fyOf(ui.asOf)) text += " It falls in " + fyLabel(fyOf(rec.date)) + ", outside the fiscal year the statements are showing.";
  if(!saved) text += " Not saved to this browser — see the warning above.";
  ui.notice = {ok:saved, text};
  ui.draft = newDraft(rec.date);
  renderEntry(); afterChange();
}
function editEntry(id){
  const e = root.entries.find(x => x.id===id);
  if(!e) return;
  ui.draft = {id:e.id, recId:null, date:e.date, ref:e.ref, memo:e.memo, rec:blankRec(),
              lines:e.lines.map(l => ({acct:String(l.acct), dr:plain(l.dr), cr:plain(l.cr)}))};

function deleteEntry(id){

/* ---------- recurring: schedules ----------
   A schedule is the entry's lines plus a rule. Occurrence k falls on step(anchor, k × every). The
   entry you post is occurrence 0, so a new schedule starts at k = 1. Occurrences are posted as
   ordinary entries once their date arrives — never ahead of time, so the books never hold a future
   rent payment that might not happen. */
const recById = id => root.recurring.find(t => t.id===id);
const nextDate = t => UNITS[t.unit].step(t.anchor, t.k*t.every);
const isDone = t => t.end==="count" ? t.posted>=t.count : nextDate(t)>t.until;
const reviewCount = () => root ? root.recurring.filter(t => t.status==="ended").length : 0;
const freqText = t => t.every===1 ? UNITS[t.unit].one : "Every " + t.every + " " + UNITS[t.unit].noun;

// Posts every occurrence that has come due, and marks schedules that have run their course for review.
function catchUp(){
  const T = today();
  let posted = 0, ended = 0;
  for(const t of root.recurring){
    if(t.status!=="active") continue;
    for(let g=0; g<5000 && !isDone(t) && nextDate(t)<=T; g++){
      const d = nextDate(t);
      root.entries.push({id:root.seq++, date:d, ref:t.ref, memo:t.memo, rec:t.id, lines:t.lines.map(l => ({...l}))});
      t.posted++; t.k++; t.lastDate = d; posted++;
    }
    if(isDone(t)){ t.status = "ended"; ended++; }
  }
  return {posted, ended};
}
function catchUpNote(c){
  const parts = [];
  if(c.posted) parts.push("Posted " + c.posted + " recurring entr" + (c.posted===1?"y":"ies") + " that came due. " + (c.posted===1?"It is":"They are") + " in the Journal, marked ↻.");
  if(c.ended) parts.push(c.ended + " schedule" + (c.ended===1?" has":"s have") + " finished — see New entry → Recurring.");
  return parts.join(" ");
}

function editRec(id, extend){
  const t = recById(id);
  if(!t) return;
  const r = {on:true, every:String(t.every), unit:t.unit, end:t.end, count:String(t.count), until:t.until};
  // "Extend" pre-fills the same run again, so a finished 12-month schedule offers 24 in all.
  if(extend){ if(t.end==="count") r.count = String(t.count + t.posted); else r.until = addMonths(t.until, 12); }
  ui.draft = {id:null, recId:id, date:nextDate(t), ref:t.ref, memo:t.memo, rec:r,
              lines:t.lines.map(l => ({acct:String(l.acct), dr:plain(l.dr), cr:plain(l.cr)}))};
  ui.notice = null; ui.tool = "entry";
  renderTool();
  $("tool").scrollTop = 0;
}
function saveSchedule(){
  const d = ui.draft, t = recById(d.recId);
  if(!t) return;
  const v = validateLines(d), errs = v.errs, spec = parseRec(d);
  if(spec.err) errs.push(spec.err);
  if(errs.length) return showErrs(errs);
  const due = specDates(spec, specCount(spec)).filter(x => x<=today()).length;
  if(due>12 && !confirm(due + " occurrences are already due and will be posted right away. Post them all?")) return;
  // Only a changed date or rhythm re-anchors the schedule. Otherwise a month-end schedule keeps landing on month ends.
  if(d.date!==nextDate(t) || spec.every!==t.every || spec.unit!==t.unit){ t.anchor = d.date; t.k = 0; }
  Object.assign(t, {ref:d.ref.trim(), memo:d.memo.trim(), lines:v.lines, every:spec.every, unit:spec.unit, end:spec.end,
                    count:spec.end==="count" ? spec.count : t.count, until:spec.until, status:"active"});
  const c = catchUp(), saved = commit();
  let text = "Saved the schedule.";
  if(c.posted) text += " " + c.posted + " occurrence" + (c.posted===1?" was":"s were") + " already due and " + (c.posted===1?"has":"have") + " been posted.";
  text += t.status==="active" ? " Next: " + fmtD(nextDate(t)) + "." : " That completes it.";
  ui.notice = {ok:saved, text: text + (saved ? "" : " Not saved to this browser.")};
  ui.draft = null; ui.tool = "recurring";
  renderTool(); afterChange();
}
function setRecStatus(id, status, text){
  const t = recById(id);
  t.status = status;
  const saved = commit();
  ui.notice = {ok:saved, text};
  renderTool(); afterChange();
}
function stopRec(id){
  const t = recById(id);
  if(!confirm("Stop “" + (t.memo || "this schedule") + "”? Nothing further will post. The " + t.posted + " entr" + (t.posted===1?"y":"ies") + " it has posted stay in the journal.")) return;
  setRecStatus(id, "done", "Stopped. It is under Archived if you want to restart it.");
}
function deleteRec(id){
  const t = recById(id);
  if(!confirm("Delete the schedule “" + (t.memo || "untitled") + "”? The " + t.posted + " entr" + (t.posted===1?"y":"ies") + " it has posted stay in the journal.")) return;
  root.recurring = root.recurring.filter(x => x.id!==id);
  const saved = commit();
  ui.draft = null;
  ui.notice = {ok:saved, text:"Schedule deleted. Its posted entries are untouched."};
  ui.tool = "recurring";
  renderTool(); afterChange();
}
function renderRecurring(){
  setTitle("Recurring entries");
  let h = entryNav() + '<div class="msg">' + noticeHtml() + '</div>';
  if(!root.recurring.length){
    $("tool").innerHTML = h + '<div class="muted">No recurring entries yet. Tick <b>Make this recurring</b> on a journal entry and it will show up here.</div>';
    return;
  }
  const g = {ended:[], active:[], done:[]};
  for(const t of root.recurring) g[t.status].push(t);
  const sortBy = f => (a,b) => f(a).localeCompare(f(b));
  const desc = t => '<td>' + esc(t.memo || "(no memo)") + (t.ref ? ' <span class="muted">' + esc(t.ref) + '</span>' : '')
    + '<div class="muted">' + esc(t.lines.map(l => acctById(l.acct)).filter(Boolean).map(a => a.name).join(" · ")) + '</div></td>'
    + '<td class="num">' + money(entryTotal(t)) + '</td><td>' + freqText(t) + '</td>';
  const table = (col, rows) => '<div class="scroll"><table><thead><tr><th>Entry</th><th class="num">Amount</th><th>Repeats</th><th>' + col + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  const history = t => 'Posted ' + t.posted + '×' + (t.lastDate ? ', last ' + gD(t.lastDate) : '');
  if(g.ended.length){
    h += '<div class="banner amber">' + (g.ended.length===1 ? 'This schedule has run its course. Extend it to keep it going, or mark it reviewed to archive it.'
                                                            : 'These schedules have run their course. Extend one to keep it going, or mark it reviewed to archive it.')
       + ' The entries already posted stay in the journal either way.</div>';
    h += table("Finished", g.ended.sort(sortBy(t => t.lastDate)).map(t => '<tr>' + desc(t) + '<td>' + history(t) + '</td><td class="act">'
      + '<button class="small warn" onclick="editRec(' + t.id + ',true)">Extend</button> '
      + '<button class="small" onclick="setRecStatus(' + t.id + ',\'done\',\'Marked reviewed and archived.\')">Mark reviewed</button></td></tr>').join(""));
  }
  if(g.active.length){
    h += '<div class="head" style="margin-top:' + (g.ended.length ? 18 : 0) + 'px">Active</div>';
    h += table("Next", g.active.sort(sortBy(nextDate)).map(t => '<tr>' + desc(t) + '<td>' + gD(nextDate(t)) + '<div class="muted">'
      + (t.end==="count" ? (t.count - t.posted) + ' of ' + t.count + ' left' : 'through ' + fmtD(t.until)) + '</div></td><td class="act">'
      + '<button class="small" onclick="editRec(' + t.id + ')">Edit</button> '
      + '<button class="small" onclick="stopRec(' + t.id + ')">Stop</button> '
      + '<button class="small danger" onclick="deleteRec(' + t.id + ')">Delete</button></td></tr>').join(""));
  }
  if(g.done.length){
    h += '<details><summary>Archived (' + g.done.length + ')</summary>' + table("History", g.done.map(t => '<tr>' + desc(t) + '<td>' + history(t) + '</td><td class="act">'
      + '<button class="small" onclick="editRec(' + t.id + ',true)">Restart</button> '
      + '<button class="small danger" onclick="deleteRec(' + t.id + ')">Delete</button></td></tr>').join("")) + '</details>';
  }
  h += '<div class="hint">Occurrences post themselves on their date, the next time the books are open on or after it. They are ordinary journal entries, marked ↻, and you can edit any one of them without touching the schedule.</div>';
  $("tool").innerHTML = h;
}

const byDateDesc = (a,b) => b.date.localeCompare(a.date) || b.id-a.id;
function renderJournalRows(){

                   + (e.rec!=null ? ' <span class="pill info" title="Posted by a recurring schedule">↻</span>' : '') + '</td>';
      h += '<td class="' + (l.dr?'dr':'cr') + '">' + esc(acctLabel(a)) + '</td><td class="num">' + (l.dr?money(l.dr):'') + '</td><td class="num">' + (l.cr?money(l.cr):'') + '</td>';
      if(j===0) h += '<td rowspan="' + n + '" class="act"><button class="small" onclick="editEntry(' + e.id + ')">Edit</button></td>';

}

/* ---------- chart of accounts ---------- */
function blankAcctForm(){ return {id:null, num:"", name:"", type:"expense", sub:"operating"}; }
function subOptions(type, sel){
  return Object.entries(TYPES[type].subs).map(([k,l]) => '<option value="' + k + '"' + (k===sel?' selected':'') + '>' + l + '</option>').join("");
}
function renderCoA(){
  const f = ui.acctForm || (ui.acctForm = blankAcctForm());
  const use = usage(), sched = recUsage(), pos = sums(null, ui.asOf);
  const editing = f.id!=null, used = editing && use.get(f.id);

  let h = '<div class="fields acctform">'
     + '<div><label>Number</label><input id="afNum" value="' + esc(f.num) + '" oninput="ui.acctForm.num=this.value" placeholder="6500"></div>'
     + '<div><label>Name</label><input id="afName" value="' + esc(f.name) + '" oninput="ui.acctForm.name=this.value" placeholder="Meals"></div>'
     + '<div><label>Type</label><select onchange="acctType(this.value)">' + TYPE_ORDER.map(t => '<option value="' + t + '"' + (t===f.type?' selected':'') + '>' + TYPES[t].label + '</option>').join("") + '</select></div>'
     + '<div><label>Classification</label><select id="afSub" onchange="ui.acctForm.sub=this.value">' + subOptions(f.type, f.sub) + '</select></div>'
     + '<div class="go"><div class="row" style="flex-wrap:nowrap">' + (editing ? '<button onclick="ui.acctForm=null;ui.notice=null;renderCoA()">Cancel</button>' : '')
     + '<button class="primary" onclick="saveAcct()">' + (editing ? 'Save account' : 'Add account') + '</button></div></div></div>';
  if(used) h += '<div class="hint" style="color:var(--amber)">This account is used in ' + used + ' entr' + (used===1?'y':'ies') + '. Changing its type or classification moves all of its history to the new place on every statement, prior years included.</div>';
  h += '<div class="msg" id="acctMsg">' + noticeHtml() + '</div>';
  h += '<div class="hint" style="margin-top:0;margin-bottom:6px">Classification decides where the account lands on the balance sheet and in the cash flow statement. Record depreciation against an <b>Accumulated depreciation</b> account, not the asset itself, or the cash flow statement will read it as a sale of equipment.</div>';
  if(!root.accounts.length){ $("tool").innerHTML = h + '<div class="muted" style="margin-top:10px">No accounts yet. Add your first one above.</div>'; return; }
  h += '<div class="scroll"><table><thead><tr><th>Number</th><th>Name</th><th>Classification</th><th class="num">Balance</th><th class="num">Entries</th><th></th></tr></thead><tbody>';
  for(const t of TYPE_ORDER){
    const list = sortedAccts().filter(a => a.type===t);
    if(!list.length) continue;
    h += '<tr class="secrow"><td colspan="6">' + TYPES[t].plural + '</td></tr>';
    for(const a of list){
      const n = use.get(a.id)||0, b = normalSign(a)*(pos.get(a.id)||0);
      h += '<tr' + (a.active?'':' class="inactive"') + '><td class="num" style="text-align:left">' + esc(a.num) + '</td><td>' + esc(a.name)

         + '<td class="num">' + (n ? fmtA(b) : '') + '</td><td class="num muted">' + (n||'') + '</td><td class="act">'
         + '<button class="small" onclick="editAcct(' + a.id + ')">Edit</button> '
         + '<button class="small" onclick="toggleAcct(' + a.id + ')" title="' + (a.active?'Hide it from the entry form; history and statements are unaffected':'Show it in the entry form again') + '">' + (a.active?'Deactivate':'Reactivate') + '</button> '
         + (n ? '<button class="small danger" disabled title="Used in ' + n + ' entr' + (n===1?'y':'ies') + ' — deactivate it instead">Delete</button>'
            : sched.has(a.id) ? '<button class="small danger" disabled title="A recurring schedule posts to it — stop or edit that schedule first">Delete</button>'
              : '<button class="small danger" onclick="deleteAcct(' + a.id + ')">Delete</button>')
         + '</td></tr>';
    }
  }
  h += '</tbody></table></div>';
  $("tool").innerHTML = h;
}
function acctType(t){
  ui.acctForm.type = t;
  ui.acctForm.sub = Object.keys(TYPES[t].subs)[0];
  $("afSub").innerHTML = subOptions(t, ui.acctForm.sub);
}
function editAcct(id){
  const a = acctById(id);
  ui.acctForm = {id:a.id, num:a.num, name:a.name, type:a.type, sub:a.sub};
  ui.notice = null; renderCoA();

}
function saveAcct(){
  const f = ui.acctForm, num = f.num.trim(), name = f.name.trim(), errs = [];
  if(!num) errs.push("Give the account a number.");
  else if(root.accounts.some(a => a.num===num && a.id!==f.id)) errs.push("Account " + num + " already exists — numbers must be unique.");
  if(!name) errs.push("Give the account a name.");
  if(errs.length){ $("acctMsg").innerHTML = errs.map(e => '<div class="err">' + esc(e) + '</div>').join(""); return; }
  let text;
  if(f.id==null){
    root.accounts.push({id:root.seq++, num, name, type:f.type, sub:f.sub, active:true});
    text = "Added " + num + " · " + name + ".";
  }else{
    Object.assign(acctById(f.id), {num, name, type:f.type, sub:f.sub});
    text = "Saved " + num + " · " + name + ".";
  }
  const saved = commit();
  ui.acctForm = null;
  ui.notice = {ok:saved, text: text + (saved ? "" : " Not saved to this browser.")};
  renderCoA(); afterChange();
}
function toggleAcct(id){ const a = acctById(id); a.active = !a.active; commit(); ui.notice = null; renderCoA(); renderTop(); }
function deleteAcct(id){
  const a = acctById(id);

}

function renderLedgerRows(){
  const a = acctById(ui.ledgerAcct);
  if(!a){ $("lRows").innerHTML = '<div class="muted">No accounts.</div>'; return; }
  const sg = normalSign(a), yr = ui.ledgerYear, is = isIS(a);
  const rows = [];
  for(const e of root.entries) for(const l of e.lines) if(l.acct===a.id) rows.push({e, l});
  rows.sort((x,y) => x.e.date.localeCompare(y.e.date) || x.e.id-y.e.id);
  let bal = 0, h = '', prevYear = null, shown = 0, tdr = 0, tcr = 0;
  // Income and expense accounts start every fiscal year at zero — last year's total now lives in retained earnings.
  if(yr!=="all" && !is){
    for(const r of rows) if(fyOf(r.e.date) < +yr) bal += sg*(r.l.dr-r.l.cr);
    h += '<tr><td colspan="6" class="muted">Opening balance, ' + gD(fyStart(+yr)) + '</td><td class="num">' + fmtA(bal) + '</td></tr>';
  }
  for(const r of rows){
    const y = fyOf(r.e.date);
    if(yr!=="all" && y!==+yr) continue;
    if(is && y!==prevYear){
      if(prevYear!==null) h += '<tr><td colspan="7" class="muted">' + gD(fyStart(y)) + ' — ' + fyLabel(prevYear) + ' closed to retained earnings; balance restarts at zero.</td></tr>';
      bal = 0;
    }
    prevYear = y;
    bal += sg*(r.l.dr-r.l.cr); tdr += r.l.dr; tcr += r.l.cr; shown++;
    h += '<tr><td style="white-space:nowrap">' + fmtD(r.e.date) + '</td><td class="muted">' + r.e.id + '</td><td>' + esc(r.e.ref) + '</td><td>' + esc(r.e.memo) + '</td>'
       + '<td class="num">' + (r.l.dr?money(r.l.dr):'') + '</td><td class="num">' + (r.l.cr?money(r.l.cr):'') + '</td>'
       + '<td class="num">' + fmtA(bal) + ' <button class="small" style="margin-left:6px" onclick="editEntry(' + r.e.id + ')">Edit</button></td></tr>';
  }
  if(!shown) h += '<tr><td colspan="7" class="muted">No activity' + (yr==="all" ? '' : ' in ' + yr) + '.</td></tr>';
  else h += '<tr class="grp"><td colspan="4" class="muted">Totals</td><td class="num">' + money(tdr) + '</td><td class="num">' + money(tcr) + '</td><td class="num" style="color:var(--gold);font-weight:700">' + fmtA(bal) + '</td></tr>';
  $("lRows").innerHTML = '<div class="scroll"><table><thead><tr><th>Date</th><th>#</th><th>Ref</th><th>Memo</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>' + h + '</tbody></table></div>'
    + '<div class="hint">' + esc(TYPES[a.type].subs[a.sub]) + ' — balance shown positive when it sits on its normal ' + (sg>0?'debit':'credit') + ' side.</div>';
}

/* ---------- settings & backup ---------- */
function renderSettings(){
  const since = root.lastExport ? 'Last backup ' + fmtD(root.lastExport.slice(0,10)) + '.' : 'Never backed up.';
  setTitle("Settings & backup");
  const M = fyM(), cur = fyOf(today());
  let h = '<div class="split"><div><label>Company name</label><input value="' + esc(root.company) + '" onchange="root.company=this.value.trim();save();renderTop()" placeholder="Shown at the top of every statement"></div>'
    + '<div><label>Fiscal year ends</label><select onchange="setFyEnd(this.value)">'
    + MONTHS.map((n,i) => '<option value="' + (i+1) + '"' + (i+1===M?' selected':'') + '>End of ' + n + (i===11?' (calendar year)':'') + '</option>').join("") + '</select></div></div>'
    + '<div class="hint">' + fyLabel(cur) + ' runs ' + gD(fyStart(cur)) + ' – ' + gD(fyEndDate(cur)) + '. Each fiscal year is named for the calendar year it ends in.'
    + (M===2 ? ' A February year end falls on the 28th, or the 29th in leap years.' : '')
    + (root.entries.length ? ' Changing it re-cuts every past year: retained earnings, the prior-year column and the P&amp;L all move to the new boundaries. No entries are changed.' : '') + '</div>'
    + '<div class="head" style="margin-top:18px">Backup</div>'
    + '<div class="muted">The books live in this browser only (local storage, key <code>' + KEY + '</code>). Clearing site data, or opening the page in another browser, shows empty books. ' + since
    + (root.changes ? ' <b style="color:var(--amber)">' + root.changes + ' change' + (root.changes===1?'':'s') + ' since.</b>' : '') + '</div>'
    + '<div class="btnrow"><button class="primary" onclick="exportFile()">Export backup (.json)</button><button onclick="$(\'impFile\').click()">Import backup…</button></div>'
    + noticeHtml();
  if(!root.entries.length && !root.accounts.length)
    h += '<div class="head" style="margin-top:18px">Try it out</div><div class="muted">Loads a sample chart of accounts and two years of entries for a small service business. Use Erase all books below to clear them when you are done.</div>'
       + '<div class="btnrow"><button onclick="loadDemo()">Load demo books</button></div>';
  h += '<details><summary>Danger zone</summary><div class="muted" style="margin-top:6px">Erases every entry and every account, leaving the books empty. The company name and fiscal year end are kept. Export first if there is anything you want to keep.</div>'
     + '<div class="btnrow"><button class="danger" onclick="eraseAll()">Erase all books</button></div></details>';
  $("tool").innerHTML = h;
}
function exportFile(){
  root.lastExport = new Date().toISOString();
  const was = root.changes;
  root.changes = 0;
  const blob = new Blob([JSON.stringify(root, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "books-" + (root.company ? root.company.replace(/[^\w-]+/g,"-").toLowerCase() + "-" : "") + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  save();
  ui.notice = {ok:true, text:"Exported " + root.entries.length + " entries and " + root.accounts.length + " accounts" + (was ? "" : " (nothing had changed since the last backup)") + "."};
  renderSettings(); renderTop();
}
function importFile(inp){
  const file = inp.files && inp.files[0];
  inp.value = "";
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj;
    try{ obj = JSON.parse(rd.result); }catch(e){ ui.notice = {ok:false, text:"That file is not valid JSON — nothing was changed."}; renderSettings(); return; }
    if(!obj || !Array.isArray(obj.accounts) || !Array.isArray(obj.entries)){ ui.notice = {ok:false, text:"That file is not a Books backup — it has no accounts and entries. Nothing was changed."}; renderSettings(); return; }
    const r = normalize(obj);
    if(!confirm("Replace the books in this browser with " + r.accounts.length + " accounts and " + r.entries.length + " entries from " + file.name + "? What is here now will be overwritten.")) return;
    r.changes = 0;
    root = r;
    const saved = save();
    ui.draft = null; ui.acctForm = null; ui.ledgerAcct = null;
    ui.notice = {ok:saved, text:"Imported " + file.name + "." + (saved ? "" : " Not saved to this browser.")};
    render();
  };
  rd.readAsText(file);
}
function eraseAll(){
  if(!confirm("Erase every entry and every account? This cannot be undone.")) return;
  const keep = {company:root.company, fyEnd:root.fyEnd};
  root = Object.assign(blank(), keep);
  const saved = save();
  ui.draft = null; ui.acctForm = null; ui.ledgerAcct = null;
  ui.notice = {ok:saved, text:"Books erased."};
  render();
}

/* ---------- statements ---------- */
function setAsOf(v){
  ui.asOf = validDate(v) ? v : today();
  renderReportsHead(); renderReports();
  if(ui.tool==="coa") renderCoA();
}
function setFyEnd(v){
  root.fyEnd = +v;
  commit();
  ui.jYear = "all"; ui.ledgerYear = "all";   // old fiscal-year filters no longer mean the same dates
  renderSettings(); renderReportsHead(); renderReports();
}
function setView(v){ root.view = v; save(); renderReportsHead(); renderReports(); }
function setTbMode(v){ root.tbMode = v; save(); renderReports(); }
function renderReportsHead(){
  const D = ui.asOf, fy = fyOf(D), from = fyStart(fy), tb = root.view==="tb";
  const fyTxt = ' · fiscal year ends ' + MONTHS[fyM()-1].slice(0,3) + ' ' + lastDay(fy, fyM()) + (fyM()===12 ? ' (calendar year)' : '');
  $("asOf").value = D;
  $("viewSeg").innerHTML = '<button class="' + (tb?'':'on') + '" onclick="setView(\'stmts\')">3-Statement</button>'
                         + '<button class="' + (tb?'on':'') + '" onclick="setView(\'tb\')">Trial balance</button>';
  $("rtitle").textContent = tb ? "Trial balance" : "Financial statements";
  $("rperiod").innerHTML = tb
    ? 'At ' + gD(D) + '<span class="vbar">|</span>income and expense accounts for ' + fyLabel(fy) + ' to date, from ' + gD(from) + fyTxt
    : 'Balance sheet at ' + gD(D) + '<span class="vbar">|</span>income and cash flow for ' + fyLabel(fy) + ' to date, ' + gD(from) + ' – ' + gD(D) + fyTxt;
  const cur = fyOf(today());
  let h = '<button class="' + (D===today()?'on':'') + '" onclick="setAsOf(\'' + today() + '\')">Today</button>';
  for(const y of yearList().filter(y => y<cur).slice(0,4))
    h += '<button class="' + (D===fyEndDate(y)?'on':'') + '" onclick="setAsOf(\'' + fyEndDate(y) + '\')" title="Year ended ' + fmtD(fyEndDate(y)) + '">' + fyLabel(y) + '</button>';
  $("yeBtns").innerHTML = h;
}

const tr = (cls, label, vals, numCls) => '<tr class="' + cls + '"><td>' + label + '</td>' + vals.map(v => '<td class="num' + (numCls ? ' ' + numCls(v) : '') + '">' + fmtA(v) + '</td>').join("") + '</tr>';
const signCls = v => v>0 ? "pos" : v<0 ? "neg" : "";
const negCls = v => v<0 ? "neg" : "";
function lines(filter, value, ncol, numCls){
  const out = [], tot = new Array(ncol).fill(0);
  for(const a of sortedAccts().filter(filter)){
    const v = value(a);
    if(v.every(x => x===0)) continue;
    v.forEach((x,i) => tot[i] += x);
    out.push(tr("ac", esc(a.name), v, numCls));
  }
  return {html:out.join(""), tot, n:out.length};
}
function stmtCard(title, period, pill, body, foot, cls){
  return '<div class="card' + (cls ? ' ' + cls : '') + '"><div class="shead"><h3>' + title + '</h3>' + (pill||'') + '</div><div class="period">' + period + '</div>'
       + '<div class="scroll"><table class="stmt">' + body + '</table></div>' + (foot ? '<div class="hint">' + foot + '</div>' : '') + '</div>';
}

function balanceSheet(D, PE){
  const c = positionAt(D), p = positionAt(PE);
  const v = sg => a => [sg*(c.cum.get(a.id)||0), sg*(p.cum.get(a.id)||0)];
  const of = (type, subs) => a => a.type===type && subs.includes(a.sub);
  let b = '<thead><tr><th></th><th class="num dt">' + fmtD(D) + '</th><th class="num dt">' + fmtD(PE) + '</th></tr></thead><tbody>';

  const group = (label, sec, subLabel) => {
    if(!sec.n) return {h:'', tot:[0,0]};
    return {h:'<tr class="grp"><td colspan="3">' + label + '</td></tr>' + sec.html + (sec.n>1 || subLabel ? tr("sub", subLabel || "Total " + label.toLowerCase(), sec.tot) : ''), tot:sec.tot};
  };
  const add = (...xs) => xs.reduce((t,x) => [t[0]+x.tot[0], t[1]+x.tot[1]], [0,0]);

  const ca = group("Current assets", lines(of("asset",["cash","current"]), v(1), 2));
  const fa = group("Fixed assets", lines(of("asset",["fixed","contra"]), v(1), 2), "Net fixed assets");
  const oa = group("Other assets", lines(of("asset",["other"]), v(1), 2));
  const TA = add(ca, fa, oa);
  b += '<tr class="sec"><td colspan="3">Assets</td></tr>' + ca.h + fa.h + oa.h + tr("tot", "Total assets", TA);

  const cl = group("Current liabilities", lines(of("liability",["current"]), v(-1), 2));
  const ll = group("Long-term liabilities", lines(of("liability",["longterm"]), v(-1), 2));
  const TL = add(cl, ll);
  b += '<tr class="sec"><td colspan="3">Liabilities</td></tr>' + cl.h + ll.h + ((cl.h && ll.h) ? tr("sub", "Total liabilities", TL) : '');
  if(!cl.h && !ll.h) b += tr("ac", "No liabilities", [0,0]);

  const eq = lines(of("equity",["contrib","draws"]), v(-1), 2, negCls);
  const reAccts = root.accounts.filter(of("equity",["re"]));
  const reBal = pos => reAccts.reduce((t,a) => t - (pos.cum.get(a.id)||0), 0);
  const RE = [reBal(c) + c.prior, reBal(p) + p.prior], NI = [c.ni, p.ni];
  const TE = [eq.tot[0]+RE[0]+NI[0], eq.tot[1]+RE[1]+NI[1]];
  b += '<tr class="sec"><td colspan="3">Equity</td></tr>' + eq.html
     + tr("ac", "Retained earnings", RE, negCls) + tr("ac", "Net income, current year", NI, negCls) + tr("sub", "Total equity", TE, negCls);
  const TLE = [TL[0]+TE[0], TL[1]+TE[1]];
  b += tr("tot", "Total liabilities &amp; equity", TLE) + '</tbody>';

  const off = TA[0]-TLE[0], offP = TA[1]-TLE[1];
  const pill = off===0 && offP===0 ? '<span class="pill good">Balances</span>'
             : '<span class="pill bad">Out by ' + fmt$(Math.abs(off||offP)) + '</span>';
  return stmtCard("Balance sheet", "At " + gD(D) + ", with the prior fiscal year end for comparison", pill, b,
    "Net income rolls into retained earnings at each fiscal year end automatically — do not post a closing entry, or that year's income statement will read zero.");
}

function incomeStatement(from, to){
  const m = sums(from, to);
  const of = (type, sub) => a => a.type===type && a.sub===sub;
  const cr = a => [-(m.get(a.id)||0)], dr = a => [m.get(a.id)||0];
  const rev = lines(of("revenue","operating"), cr, 1);
  const cogs = lines(of("expense","cogs"), dr, 1);
  const opx = lines(of("expense","operating"), dr, 1);
  const oi = lines(of("revenue","other"), cr, 1);
  const oe = lines(of("expense","other"), a => [-(m.get(a.id)||0)], 1);  // shown as a deduction inside "other"
  const GP = rev.tot[0] - cogs.tot[0], OP = GP - opx.tot[0], OTH = oi.tot[0] + oe.tot[0], NI = OP + OTH;

  let b = '<tbody><tr class="sec"><td colspan="2">Revenue</td></tr>' + (rev.n ? rev.html : tr("ac","No revenue",[0])) + tr("sub", "Total revenue", rev.tot, negCls);
  if(cogs.n) b += '<tr class="sec"><td colspan="2">Cost of goods sold</td></tr>' + cogs.html + tr("sub", "Gross profit", [GP], negCls);
  b += '<tr class="sec"><td colspan="2">Operating expenses</td></tr>' + (opx.n ? opx.html : tr("ac","No operating expenses",[0])) + tr("sub", "Total operating expenses", opx.tot, negCls)
     + '<tr class="gap"><td colspan="2"></td></tr>' + tr("sub", "Operating income", [OP], negCls);
  if(oi.n || oe.n) b += '<tr class="sec"><td colspan="2">Other income (expense)</td></tr>' + oi.html + oe.html + tr("sub", "Net other income (expense)", [OTH], negCls);
  b += tr("tot", "Net income", [NI], signCls) + '</tbody>';
  const margin = rev.tot[0] ? ' · <span style="font-family:var(--mono)">' + (NI/rev.tot[0]*100).toFixed(1) + '%</span> of revenue' : '';
  return {html: stmtCard("Profit &amp; loss", fyLabel(fyOf(to)) + " to date, " + gD(from) + " – " + gD(to) + margin, "", b), NI};
}

function cashFlow(from, to, PE){
  const m = sums(from, to), NI = netIncome(m);
  const cashAt = D => { const s = sums(null, D); return root.accounts.filter(a => a.type==="asset" && a.sub==="cash").reduce((t,a) => t+(s.get(a.id)||0), 0); };
  // Cash effect of a balance-sheet account is the opposite of its debit-side change: an asset that
  // grew used cash, a liability that grew supplied it. Summed with net income, this is the change in cash exactly.
  const eff = a => [-(m.get(a.id)||0)];
  const of = pairs => a => pairs.some(([t,s]) => a.type===t && s.includes(a.sub));
  const adj = lines(of([["asset",["contra"]]]), eff, 1);
  const wc  = lines(of([["asset",["current"]],["liability",["current"]]]), eff, 1);
  const inv = lines(of([["asset",["fixed","other"]]]), eff, 1);
  const fin = lines(of([["liability",["longterm"]],["equity",["contrib","draws","re"]]]), eff, 1);
  const OPS = NI + adj.tot[0] + wc.tot[0], NET = OPS + inv.tot[0] + fin.tot[0];
  const begin = cashAt(PE), end = cashAt(to);

  let b = '<tbody><tr class="sec"><td colspan="2">Operating activities</td></tr>' + tr("ac", "Net income", [NI], negCls);
  if(adj.n) b += '<tr class="grp"><td colspan="2">Non-cash adjustments</td></tr>' + adj.html.replace(/<td>([^<]*)<\/td>/g, '<td>Depreciation — $1</td>');
  if(wc.n) b += '<tr class="grp"><td colspan="2">Changes in working capital</td></tr>' + wc.html;
  b += tr("sub", "Net cash from operating", [OPS], negCls);
  b += '<tr class="sec"><td colspan="2">Investing activities</td></tr>' + (inv.n ? inv.html : tr("ac","None",[0])) + tr("sub", "Net cash from investing", inv.tot, negCls);
  b += '<tr class="sec"><td colspan="2">Financing activities</td></tr>' + (fin.n ? fin.html : tr("ac","None",[0])) + tr("sub", "Net cash from financing", fin.tot, negCls);
  b += '<tr class="gap"><td colspan="2"></td></tr>' + tr("sub", "Net change in cash", [NET], signCls)
     + tr("ac", "Cash at " + gD(PE), [begin], negCls) + tr("tot", "Cash at " + gD(to), [begin+NET], negCls) + '</tbody>';
  const ties = begin + NET === end;
  const pill = ties ? '<span class="pill good">Ties to cash</span>' : '<span class="pill bad">Off by ' + fmt$(Math.abs(begin+NET-end)) + '</span>';
  return stmtCard("Cash flow", "Indirect method, " + gD(from) + " – " + gD(to), pill, b,
    "Built from the change in each balance-sheet account. Asset sales and the current portion of long-term debt are not split out.");
}

function renderReports(){
  const D = ui.asOf, fy = fyOf(D), from = fyStart(fy), PE = fyEndDate(fy-1);
  if(!root.entries.length){
    $("stmts").innerHTML = '<div class="card empty" style="grid-column:1/-1"><div class="muted">No entries yet. Set up your chart of accounts and post a journal entry — or load the demo from Settings &amp; backup — and the balance sheet, P&amp;L and cash flow will build here.</div></div>';
    return;
  }
  $("stmts").innerHTML = root.view==="tb" ? trialBalance(D) : balanceSheet(D, PE) + incomeStatement(from, D).html + cashFlow(from, D, PE);
}

// Post-closing for past years, pre-closing for this one: balance-sheet accounts at D, income and
// expense accounts for the fiscal year to date, and every earlier year's income inside retained
// earnings — the same books the statements read, so the two views can never disagree.
function trialBalance(D){
  const fy = fyOf(D), c = positionAt(D), ytd = sums(fyStart(fy), D);
  let prior = c.prior, tdr = 0, tcr = 0;
  // Single column: debits positive, credits negative, so a balanced trial balance sums to zero.
  const one = root.tbMode==="net", cols = one ? 3 : 4;
  const signed = v => (v<0 ? "-" : "") + money(Math.abs(v));
  let b = '<thead><tr><th>Number</th><th>Account</th>'
        + (one ? '<th class="num">Balance</th>' : '<th class="num">Debit</th><th class="num">Credit</th>') + '</tr></thead><tbody>';
  const row = (num, name, v) => {
    if(v>0) tdr += v; else tcr -= v;
    return '<tr class="ac"><td>' + esc(num) + '</td><td>' + name + '</td>'
         + (one ? '<td class="num">' + signed(v) + '</td>'
                : '<td class="num">' + (v>0 ? money(v) : '') + '</td><td class="num">' + (v<0 ? money(-v) : '') + '</td>') + '</tr>';
  };
  for(const t of TYPE_ORDER){
    let rows = '';
    for(const a of sortedAccts().filter(a => a.type===t)){
      let v = (isIS(a) ? ytd : c.cum).get(a.id) || 0;
      if(a.sub==="re" && prior){ v -= prior; prior = 0; }   // earlier years' income is a credit to retained earnings
      if(v) rows += row(a.num, esc(a.name), v);
    }
    if(t==="equity" && prior){ rows += row("", "Retained earnings — earlier years' income", -prior); prior = 0; }
    if(rows) b += '<tr class="sec"><td colspan="' + cols + '">' + TYPES[t].plural + '</td></tr>' + rows;
  }
  b += '<tr class="tot"><td></td><td>' + (one ? 'Net' : 'Totals') + '</td>'
     + (one ? '<td class="num">' + signed(tdr-tcr) + '</td>' : '<td class="num">' + money(tdr) + '</td><td class="num">' + money(tcr) + '</td>') + '</tr></tbody>';
  const pill = tdr===tcr ? '<span class="pill good">Balanced</span>' : '<span class="pill bad">Out by ' + fmt$(Math.abs(tdr-tcr)) + '</span>';
  const seg = '<span class="seg no-print">'
    + '<button class="small' + (one?'':' on') + '" onclick="setTbMode(\'drcr\')">Debit / Credit</button>'
    + '<button class="small' + (one?' on':'') + '" onclick="setTbMode(\'net\')">Single column</button></span>';
  return stmtCard("Trial balance", "At " + gD(D), '<span class="row" style="align-items:center">' + seg + pill + '</span>', b,
    (one ? "Debits are positive and credits negative, so the column nets to zero when the books balance. " : "")
    + "Accounts with a zero balance are left out. Income and expense accounts restart at zero each fiscal year; everything they earned before " + fmtD(fyStart(fy)) + " is in retained earnings.", "tbcard");
}

function render(){ renderTop(); renderBanners(); renderToolbar(); renderTool(); renderReportsHead(); renderReports(); }

document.addEventListener("keydown", e => { if(e.key==="Escape" && ui.tool) openTool(null); });

// Coming back to a tab left open overnight still posts what came due, rather than waiting for a reload.
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState!=="visible" || !root) return;
  const c = catchUp();
  if(!c.posted && !c.ended) return;
  commit();
  recNote = catchUpNote(c);
  afterChange();
  if(ui.tool==="recurring") renderRecurring();
});

root = load();
{
  const c = catchUp();
  if(c.posted || c.ended){ commit(); recNote = catchUpNote(c); }
}
render();
</script>
